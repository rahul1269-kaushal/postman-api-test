type: http
name: Create a new refund
url: '{{baseUrl}}/refunds'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "transactionId": "txn_1234567890abcdef",
      "amount": null,
      "reason": "Customer requested refund",
      "notifyCustomer": true,
      "metadata": {
        "initiatedBy": "admin@example.com",
        "ticketNumber": "TKT-12345"
      }
    }
