type: http
name: Upload a document
url: '{{baseUrl}}/applications/:applicationId/documents'
method: POST
headers:
  - key: Content-Type
    value: multipart/form-data
  - key: Accept
    value: application/json
pathVariables:
  - key: applicationId
    value: string
body:
  type: formdata
  content:
    - key: file
      type: file
    - key: documentType
      value: bank_statement
      type: text
