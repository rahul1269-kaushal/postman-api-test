type: http
name: Get application details
url: '{{baseUrl}}/applications/:applicationId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: applicationId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "applicantId": "string",
            "productType": "string",
            "requestedAmount": 1335.7507892408994,
            "termMonths": 8421,
            "status": "submitted",
            "createdAt": "2023-10-26T16:39:29.331Z",
            "updatedAt": "2001-04-15T17:49:08.138Z",
            "underwritingResult": {
              "applicationId": "string",
              "status": "failed",
              "decision": "denied",
              "riskScore": 66,
              "evaluatedAt": "1985-10-13T23:12:11.155Z"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "code": "string",
            "message": "string",
            "details": {}
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application not found
