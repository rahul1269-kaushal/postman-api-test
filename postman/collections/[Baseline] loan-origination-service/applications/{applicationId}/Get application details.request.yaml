type: http
name: Get application details
url: '{{baseUrl}}/applications/:applicationId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: applicationId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "applicantId": "string",
            "productType": "string",
            "requestedAmount": 3883.7256803276086,
            "termMonths": 4114,
            "status": "denied",
            "createdAt": "1984-05-02T08:15:21.162Z",
            "updatedAt": "1989-07-03T09:17:56.971Z",
            "underwritingResult": {
              "applicationId": "string",
              "status": "in_progress",
              "decision": "referred_to_manual",
              "riskScore": 62,
              "evaluatedAt": "1982-04-10T13:07:45.714Z"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "code": "string",
            "message": "string",
            "details": {}
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application not found
