type: http
name: Get claim details
url: '{{baseUrl}}/claims/:claimId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "settled",
            "incidentDate": "2013-09-08",
            "description": "string",
            "estimatedDamage": 1937.1844238622182,
            "filedAt": "2015-01-19T04:22:48.724Z",
            "updatedAt": "1979-05-28T15:11:02.221Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 4988.037699066777,
              "adjudicatedAt": "1956-11-13T10:11:16.988Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 4137.803998465493,
              "paymentMethod": "string",
              "status": "initiated",
              "initiatedAt": "2007-11-20T05:19:01.421Z",
              "completedAt": "2010-02-27T22:56:11.629Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim details
