type: http
name: Get claim details
url: '{{baseUrl}}/claims/:claimId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "triaged",
            "incidentDate": "1980-07-11",
            "description": "string",
            "estimatedDamage": 3737.5499817887603,
            "filedAt": "1981-01-21T01:24:55.270Z",
            "updatedAt": "1979-08-11T07:24:20.956Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 8197.95017882686,
              "adjudicatedAt": "2007-10-24T14:12:48.847Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 262.1405895785844,
              "paymentMethod": "string",
              "status": "failed",
              "initiatedAt": "1994-02-03T22:28:25.735Z",
              "completedAt": "1986-10-04T13:47:19.076Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Claim not found
