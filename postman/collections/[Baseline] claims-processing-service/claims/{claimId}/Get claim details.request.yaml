type: http
name: Get claim details
url: '{{baseUrl}}/claims/:claimId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "closed",
            "incidentDate": "1958-10-05",
            "description": "string",
            "estimatedDamage": 827.1809860566804,
            "filedAt": "1970-12-23T05:57:51.576Z",
            "updatedAt": "1977-10-04T20:34:47.229Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 5034.624782881626,
              "adjudicatedAt": "1959-10-03T20:02:34.192Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 6916.799579248785,
              "paymentMethod": "string",
              "status": "processing",
              "initiatedAt": "1984-06-12T09:23:31.662Z",
              "completedAt": "1956-10-13T10:22:13.150Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Claim not found
