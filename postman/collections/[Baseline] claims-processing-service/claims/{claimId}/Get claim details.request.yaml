type: http
name: Get claim details
url: '{{baseUrl}}/claims/:claimId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "settled",
            "incidentDate": "1980-06-15",
            "description": "string",
            "estimatedDamage": 3304.097818236136,
            "filedAt": "2010-07-25T18:53:36.392Z",
            "updatedAt": "1950-07-30T17:31:43.979Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 7329.029748992379,
              "adjudicatedAt": "1986-06-28T15:21:54.851Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 8810.210615097752,
              "paymentMethod": "string",
              "status": "completed",
              "initiatedAt": "1965-11-19T10:33:36.972Z",
              "completedAt": "2013-11-13T11:06:21.490Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Claim not found
