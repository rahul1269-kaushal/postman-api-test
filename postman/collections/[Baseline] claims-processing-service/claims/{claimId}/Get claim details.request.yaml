type: http
name: Get claim details
url: '{{baseUrl}}/claims/:claimId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "adjudicated",
            "incidentDate": "1996-02-10",
            "description": "string",
            "estimatedDamage": 3354.959182728967,
            "filedAt": "1992-10-21T12:52:57.336Z",
            "updatedAt": "1985-12-19T15:18:33.266Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 6096.540375010771,
              "adjudicatedAt": "2013-12-11T03:42:45.675Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 404.8234384383342,
              "paymentMethod": "string",
              "status": "completed",
              "initiatedAt": "2004-12-07T11:03:17.822Z",
              "completedAt": "2016-04-04T21:43:08.204Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Claim not found
