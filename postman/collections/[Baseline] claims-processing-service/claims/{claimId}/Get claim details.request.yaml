type: http
name: Get claim details
url: '{{baseUrl}}/claims/:claimId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "denied",
            "incidentDate": "1963-08-07",
            "description": "string",
            "estimatedDamage": 7782.538318895545,
            "filedAt": "1953-09-03T17:24:25.533Z",
            "updatedAt": "1951-07-01T02:48:45.751Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 6657.686989987591,
              "adjudicatedAt": "1999-05-13T01:28:19.799Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 3480.853616949884,
              "paymentMethod": "string",
              "status": "completed",
              "initiatedAt": "1969-09-19T22:27:10.962Z",
              "completedAt": "1978-09-22T01:09:57.406Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Claim not found
