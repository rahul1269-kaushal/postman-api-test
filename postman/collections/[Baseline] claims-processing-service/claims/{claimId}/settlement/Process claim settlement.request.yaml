type: http
name: Process claim settlement
url: '{{baseUrl}}/claims/:claimId/settlement'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
body:
  type: json
  content: |-
    {
      "paymentMethod": "wire",
      "amount": 5205.40972949783,
      "payeeName": "string",
      "payeeAccountId": "string"
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "claimId": "string",
            "amount": 6407.55263782202,
            "paymentMethod": "string",
            "status": "initiated",
            "initiatedAt": "1996-08-03T20:32:09.947Z",
            "completedAt": "2025-02-02T02:20:49.421Z",
            "referenceNumber": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Settlement initiated
  - response:
      statusCode: 400
      statusText: Bad Request
      body:
        type: text
        content: ''
    name: Claim not eligible for settlement
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Claim not found
