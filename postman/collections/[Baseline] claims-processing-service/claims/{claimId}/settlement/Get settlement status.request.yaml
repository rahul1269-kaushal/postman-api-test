type: http
name: Get settlement status
url: '{{baseUrl}}/claims/:claimId/settlement'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "claimId": "string",
            "amount": 9159.317929279114,
            "paymentMethod": "string",
            "status": "completed",
            "initiatedAt": "1957-10-05T19:05:24.412Z",
            "completedAt": "2015-03-15T04:09:01.743Z",
            "referenceNumber": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Settlement details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: No settlement found for this claim
