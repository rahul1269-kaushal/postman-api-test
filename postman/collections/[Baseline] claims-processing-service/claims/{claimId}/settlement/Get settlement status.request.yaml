type: http
name: Get settlement status
url: '{{baseUrl}}/claims/:claimId/settlement'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "claimId": "string",
            "amount": 4795.054490955247,
            "paymentMethod": "string",
            "status": "completed",
            "initiatedAt": "2008-08-09T06:42:56.208Z",
            "completedAt": "1957-05-08T06:34:37.629Z",
            "referenceNumber": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Settlement details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: No settlement found for this claim
