type: http
name: Get settlement status
url: '{{baseUrl}}/claims/:claimId/settlement'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "claimId": "string",
            "amount": 5318.662304140282,
            "paymentMethod": "string",
            "status": "processing",
            "initiatedAt": "1974-06-28T20:44:47.269Z",
            "completedAt": "1981-11-15T22:47:03.651Z",
            "referenceNumber": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Settlement details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: No settlement found for this claim
