type: http
name: File a new claim
url: '{{baseUrl}}/claims'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "policyId": "pol_auto_12345",
      "lineOfBusiness": "auto",
      "incidentDate": "2026-02-15",
      "description": "Rear-end collision at intersection",
      "estimatedDamage": 8500,
      "claimantContact": {
        "name": "Jane Smith",
        "phone": "+1-555-0123",
        "email": "jane.smith@example.com"
      }
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "under_investigation",
            "incidentDate": "2006-03-13",
            "description": "string",
            "estimatedDamage": 6731.7761126886935,
            "filedAt": "1979-03-08T01:04:22.019Z",
            "updatedAt": "1971-03-18T21:57:09.263Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 5302.1835138844,
              "adjudicatedAt": "1979-11-18T11:11:26.264Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 923.5685598217214,
              "paymentMethod": "string",
              "status": "initiated",
              "initiatedAt": "2016-11-14T15:38:29.033Z",
              "completedAt": "2019-05-02T03:20:17.786Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim filed successfully
  - response:
      statusCode: 400
      statusText: Bad Request
      body:
        type: json
        content: |-
          {
            "code": "string",
            "message": "string",
            "details": {}
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Invalid claim data
  - response:
      statusCode: 409
      statusText: Conflict
      body:
        type: text
        content: ''
    name: Duplicate claim for this incident
