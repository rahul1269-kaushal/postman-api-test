type: http
name: Get claim details
url: '{{baseUrl}}/claims/:claimId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: claimId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "policyId": "string",
            "lineOfBusiness": "string",
            "status": "filed",
            "incidentDate": "1982-02-28",
            "description": "string",
            "estimatedDamage": 3416.5395597849833,
            "filedAt": "1979-10-05T14:34:13.315Z",
            "updatedAt": "1958-02-13T11:16:45.027Z",
            "assignedAdjuster": "string",
            "adjudication": {
              "claimId": "string",
              "decision": "string",
              "approvedAmount": 8846.45398077758,
              "adjudicatedAt": "1977-09-23T02:06:14.693Z",
              "adjusterNotes": "string"
            },
            "settlement": {
              "claimId": "string",
              "amount": 2475.7770971203386,
              "paymentMethod": "string",
              "status": "completed",
              "initiatedAt": "2015-06-30T18:23:48.710Z",
              "completedAt": "1978-09-26T03:10:46.063Z",
              "referenceNumber": "string"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Claim details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Claim not found
