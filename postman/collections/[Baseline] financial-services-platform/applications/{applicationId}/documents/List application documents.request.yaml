  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          [
            {
              "id": "string",
              "applicationId": "string",
              "documentType": "string",
              "fileName": "string",
              "uploadedAt": "2004-08-10T16:48:40.197Z",
              "verificationStatus": "pending"
            },
            {
              "id": "string",
              "applicationId": "string",
              "documentType": "string",
              "fileName": "string",
              "uploadedAt": "1963-11-09T13:23:33.934Z",
              "verificationStatus": "pending"
            }
          ]
      headers:
        - key: Content-Type
          value: application/json
    name: List of documents
