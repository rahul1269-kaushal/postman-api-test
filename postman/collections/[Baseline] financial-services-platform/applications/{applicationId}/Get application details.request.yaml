type: http
name: Get application details
url: '{{baseUrl}}/applications/:applicationId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: applicationId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "applicantId": "string",
            "productType": "string",
            "requestedAmount": 9148.904151317947,
            "termMonths": 8521,
            "status": "under_review",
            "createdAt": "1989-07-31T15:35:25.706Z",
            "updatedAt": "1964-05-08T17:45:06.503Z",
            "underwritingResult": {
              "applicationId": "string",
              "status": "pending",
              "decision": "denied",
              "riskScore": 58,
              "evaluatedAt": "1954-12-07T05:04:26.560Z"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "code": "string",
            "message": "string",
            "details": {}
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application not found
