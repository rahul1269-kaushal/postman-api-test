type: http
name: Get application details
url: '{{baseUrl}}/applications/:applicationId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: applicationId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "applicantId": "string",
            "productType": "string",
            "requestedAmount": 4909.224441283877,
            "termMonths": 1700,
            "status": "withdrawn",
            "createdAt": "1954-03-03T04:28:27.773Z",
            "updatedAt": "1995-10-05T14:14:59.618Z",
            "underwritingResult": {
              "applicationId": "string",
              "status": "failed",
              "decision": "referred_to_manual",
              "riskScore": 44,
              "evaluatedAt": "2010-05-10T00:51:52.817Z"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "code": "string",
            "message": "string",
            "details": {}
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application not found
