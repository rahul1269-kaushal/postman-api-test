name: Onboard Loan Origination API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'spec/loan-origination-api-openapi.yaml'

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Onboard Loan Origination Service into Postman
        uses: postman-cs/postman-api-onboarding-action@v0
        with:
          project-name: financial-services-platform
          spec-url: https://raw.githubusercontent.com/${{ github.repository }}/main/spec/loan-origination-api-openapi.yaml
          artifact-dir: postman/loan-origination
          domain: lending
          environments-json: '["prod","staging","dev"]'
          env-runtime-urls-json: >-
            {
              "prod":    "https://lending-api.example.com/v1",
              "staging": "https://lending-api-staging.example.com/v1",
              "dev":     "https://lending-api-dev.example.com/v1"
            }
          breaking-change-mode: pr-native
          monitor-cron: '0 9 * * 1-5'
          # mTLS credentials required for loan origination (mTLS service-to-service auth).
          # Add LOAN_SSL_CLIENT_CERT and LOAN_SSL_CLIENT_KEY as base64-encoded PEM secrets.
          # Leave blank and the action skips mTLS setup without failing the run.
          ssl-client-cert: ${{ secrets.LOAN_SSL_CLIENT_CERT }}
          ssl-client-key: ${{ secrets.LOAN_SSL_CLIENT_KEY }}
          generate-ci-workflow: false
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ secrets.POSTMAN_ACCESS_TOKEN }}
          github-token: ${{ github.token }}
