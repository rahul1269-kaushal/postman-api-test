name: Onboard Claims Processing API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'spec/claims-processing-api-openapi.yaml'

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Onboard Claims Processing Service into Postman
        uses: postman-cs/postman-api-onboarding-action@v0
        with:
          project-name: financial-services-platform
          spec-url: https://raw.githubusercontent.com/${{ github.repository }}/main/spec/claims-processing-api-openapi.yaml
          artifact-dir: postman/claims-processing
          domain: insurance
          environments-json: '["prod","staging","dev"]'
          breaking-change-mode: off
          monitor-cron: '0 9 * * 1-5'
          onboarding-scope: spec-only
          # Note: This service deploys via GitLab CI, not GitHub Actions.
          # breaking-change-mode is off because pr-native requires GitHub PR context.
          # onboarding-scope is spec-only because the claims spec has schema quality
          # issues (missing $ref, no 5xx responses) that block contract collection generation.
          # Fixing the spec is a prerequisite before full collection generation can run.
          generate-ci-workflow: false
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ secrets.POSTMAN_ACCESS_TOKEN }}
          github-token: ${{ github.token }}
